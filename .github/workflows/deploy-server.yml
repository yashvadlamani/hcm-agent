name: Deploy Clara server

# Redeploys the Clara phone server (Azure App Service) whenever its code changes on main.
# Runs the lint and tests first and deploys only if they pass. Needs the repository secret
# AZURE_WEBAPP_PUBLISH_PROFILE; see docs/DEPLOY_AZURE.md. Without it, the deploy is skipped.
#
# Deploying restarts the app, which drops any call in progress.

on:
  push:
    branches: [main]
    paths:
      - "src/hcm_agent/**"
      - "requirements.txt"
      - "deploy/azure/package.py"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency: deploy-server

env:
  WEBAPP: ${{ vars.AZURE_WEBAPP_NAME || 'clara-hcm-agent-demo' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check for the publish profile secret
        id: secret
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -n "$PROFILE" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::AZURE_WEBAPP_PUBLISH_PROFILE isn't set; skipping deploy."; fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.secret.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Build the app package
        if: steps.secret.outputs.present == 'true'
        run: python deploy/azure/package.py clara-app.zip

      # Azure installs requirements.txt during the deploy (SCM_DO_BUILD_DURING_DEPLOYMENT).
      # The Free tier's deploy service sometimes times out, so try twice.
      - name: Deploy to App Service
        id: deploy1
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP }}
          package: clara-app.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Deploy to App Service (retry)
        if: steps.secret.outputs.present == 'true' && steps.deploy1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP }}
          package: clara-app.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Check the server is up
        if: steps.secret.outputs.present == 'true'
        run: |
          url="https://${WEBAPP}.azurewebsites.net/"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url" || true)
            if [ "$code" = "200" ]; then echo "Clara is up: $url"; exit 0; fi
            if [ "$code" = "403" ]; then
              echo "::warning::The app is stopped (start.ps1 turns it on). The new code runs when it starts."
              exit 0
            fi
            echo "Waiting for Clara to start (HTTP $code)..."; sleep 10
          done
          echo "::error::Clara didn't respond after the deploy. Check the logs in the Azure portal."
          exit 1
