<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clara Live Calls</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --text: #1d2330; --muted: #6b7380;
    --accent: #2f6fdf; --accent-soft: #e8f0fd; --patient: #f0f1f4;
    --ok: #1f9d55; --warn: #b7791f; --warn-soft: #fdf4e3; --bad: #c53030; --bad-soft: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --line: #2a303b; --text: #e6e9ee; --muted: #9098a5;
      --accent: #6d9bff; --accent-soft: #1f2a40; --patient: #242a34;
      --ok: #48bb78; --warn: #ecc94b; --warn-soft: #3a3120; --bad: #fc8181; --bad-soft: #3d2224;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .conn { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
  main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  aside h2 { margin: 0; padding: 14px 16px 8px; font-size: 12px; text-transform: uppercase;
             letter-spacing: .04em; color: var(--muted); }
  .call-item { display: block; width: 100%; text-align: left; border: 0; background: none;
               color: inherit; font: inherit; padding: 10px 16px; border-left: 3px solid transparent;
               cursor: pointer; }
  .call-item:hover { background: var(--bg); }
  .call-item.selected { background: var(--accent-soft); border-left-color: var(--accent); }
  .call-item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .call-item .name { font-weight: 600; }
  .call-item .sub { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .pill.live { background: var(--accent-soft); color: var(--accent); }
  .pill.ended { background: var(--patient); color: var(--muted); }
  .pill.emergency { background: var(--bad-soft); color: var(--bad); }
  section { display: flex; flex-direction: column; min-width: 0; }
  .call-head { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .call-head .title { font-size: 15px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .call-head .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .timeline { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 72%; }
  .msg.clara { align-self: flex-start; } .msg.patient { align-self: flex-end; text-align: right; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .bubble { display: inline-block; text-align: left; padding: 9px 13px; border-radius: 12px;
            white-space: pre-wrap; word-wrap: break-word; }
  .clara .bubble { background: var(--accent-soft); border-top-left-radius: 4px; }
  .clara.system .bubble { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .patient .bubble { background: var(--patient); border-top-right-radius: 4px; }
  .tag { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tag.low { color: var(--warn); font-weight: 600; }
  .card { align-self: stretch; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .card.guardrail { background: var(--warn-soft); border: 1px solid var(--warn); }
  .card.emergency { background: var(--bad-soft); border: 1px solid var(--bad); color: var(--bad); font-weight: 600; }
  .card details { margin-top: 6px; } .card summary { cursor: pointer; color: var(--muted); }
  .card blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 3px solid var(--warn); color: var(--muted); }
  .divider { align-self: center; color: var(--muted); font-size: 12px; padding: 4px 12px;
             border: 1px solid var(--line); border-radius: 999px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; padding: 20px; }
  .empty code { display: block; margin-top: 10px; padding: 8px; background: var(--panel);
                border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>
<header>
  <h1>Clara <span>· Live calls</span></h1>
  <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></div>
</header>
<main>
  <aside>
    <h2>Calls this session</h2>
    <div id="call-list"></div>
  </aside>
  <section>
    <div class="call-head" id="call-head" hidden>
      <div class="title"><span id="head-name"></span><span class="pill" id="head-status"></span></div>
      <div class="meta" id="head-meta"></div>
    </div>
    <div class="timeline" id="timeline">
      <div class="empty">
        <strong>Waiting for a call…</strong>
        <p>Calls appear here the moment they connect. Start one from the project folder:</p>
        <code id="start-command">clara-call --url https://&lt;your-app&gt;.azurewebsites.net --to +1XXXXXXXXXX --name &lt;FirstName&gt;</code>
      </div>
    </div>
  </section>
</main>

<script>
const calls = new Map();   // call ID -> { name, drivers, started, ended, status, events: [] }
let selected = null;
let userPicked = false;
let lastEventId = 0;   // the server replays its backlog on reconnect; skip what we've already shown
let bootId = null;     // changes when the server restarts, which resets its event ids

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
const duration = (secs) => `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, "0")}`;
const RULES = {
  medical_diagnosis: "a diagnosis",
  medical_advice: "medical advice",
  prescription_change: "a medication change",
};

function handle(event) {
  if (event.boot !== bootId) {
    bootId = event.boot; lastEventId = 0;
    calls.clear(); selected = null; userPicked = false;
  }
  if (event.id <= lastEventId) return;
  lastEventId = event.id;
  let call = calls.get(event.call);
  if (!call) {
    call = { name: "Unknown caller", drivers: [], started: event.ts, ended: null, status: "live", events: [] };
    calls.set(event.call, call);
  }
  if (event.type === "call_started") {
    call.name = event.name; call.drivers = event.drivers || []; call.started = event.ts;
    if (!userPicked) selected = event.call;
  }
  if (event.type === "emergency") call.status = "emergency";
  if (event.type === "call_ended") {
    call.ended = event.ts;
    if (call.status !== "emergency") call.status = "ended";
  }
  call.events.push(event);
  if (!selected) selected = event.call;
  renderList();
  if (event.call === selected) renderCall();
}

function renderList() {
  const list = $("call-list");
  list.replaceChildren();
  [...calls.entries()].reverse().forEach(([sid, call]) => {
    const item = el("button", "call-item" + (sid === selected ? " selected" : ""));
    const row = el("div", "row");
    row.append(el("span", "name", call.name));
    row.append(el("span", `pill ${call.status}`, call.status === "live" ? "Live" : call.status === "emergency" ? "Emergency" : "Ended"));
    item.append(row, el("div", "sub", `${clock(call.started)} · ${sid.slice(-6)}`));
    item.onclick = () => { selected = sid; userPicked = true; renderList(); renderCall(); };
    list.append(item);
  });
}

function renderCall() {
  const call = calls.get(selected);
  if (!call) return;
  $("call-head").hidden = false;
  $("head-name").textContent = call.name;
  const status = $("head-status");
  status.className = `pill ${call.status}`;
  status.textContent = call.status === "live" ? "Live" : call.status === "emergency" ? "Emergency" : "Ended";
  updateMeta();

  const timeline = $("timeline");
  const atBottom = timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight < 60;
  timeline.replaceChildren();
  let waiting = false;

  for (const e of call.events) {
    if (e.type === "clara") {
      waiting = false;
      const msg = el("div", "msg clara" + (e.kind === "system" ? " system" : ""));
      msg.append(el("div", "who", `Clara · ${clock(e.ts)}`), el("div", "bubble", e.text));
      if (e.latency !== undefined) msg.append(el("div", "tag", `Replied in ${e.latency}s`));
      timeline.append(msg);
    } else if (e.type === "patient") {
      const msg = el("div", "msg patient");
      msg.append(el("div", "who", `Patient · ${clock(e.ts)}`), el("div", "bubble", e.text));
      if (e.confidence !== null && e.confidence !== undefined) {
        const pct = Math.round(e.confidence * 100);
        msg.append(el("div", "tag" + (pct < 60 ? " low" : ""),
          pct < 60 ? `Low speech confidence (${pct}%), may be misheard` : `Speech confidence ${pct}%`));
      }
      timeline.append(msg);
    } else if (e.type === "thinking") {
      waiting = true;
    } else if (e.type === "guardrail") {
      const card = el("div", "card guardrail");
      card.append(el("strong", null, `Guardrail: blocked a reply that looked like ${RULES[e.rule] || e.rule}`));
      card.append(el("div", null, "Clara said the safe fallback below instead."));
      const details = el("details");
      details.append(el("summary", null, "Show the blocked reply"), el("blockquote", null, e.blocked_text));
      card.append(details);
      timeline.append(card);
    } else if (e.type === "emergency") {
      const trigger = (e.reason || "").replace(/^[^:]*:\s*/, "");
      timeline.append(el("div", "card emergency", `Emergency detected (“${trigger}”). Clara skipped the model and gave the 911 message.`));
    } else if (e.type === "call_ended") {
      timeline.append(el("div", "divider", `Call ended · ${e.reason}`));
    }
  }
  if (waiting && !call.ended) timeline.append(el("div", "typing", "Clara is preparing a reply…"));
  if (atBottom || call.status === "live") timeline.scrollTop = timeline.scrollHeight;
}

function updateMeta() {
  const call = calls.get(selected);
  if (!call) return;
  const end = call.ended || Date.now() / 1000;
  const turns = call.events.filter((e) => e.type === "patient").length;
  const parts = [`Started ${clock(call.started)}`, `Duration ${duration(end - call.started)}`, `${turns} patient turn${turns === 1 ? "" : "s"}`];
  if (call.drivers.length) parts.push(`Risk drivers: ${call.drivers.join(", ")}`);
  $("head-meta").textContent = parts.join(" · ");
}
setInterval(() => { const c = calls.get(selected); if (c && !c.ended) updateMeta(); }, 1000);

// Show the exact command for this deployment, using the address this page was loaded from.
$("start-command").textContent =
  `clara-call --url ${location.origin} --to +1XXXXXXXXXX --name <FirstName>`;

function connect() {
  const source = new EventSource("/live/events");
  source.onopen = () => { $("conn-dot").className = "dot on"; $("conn-text").textContent = "Connected"; };
  source.onmessage = (msg) => handle(JSON.parse(msg.data));
  source.onerror = () => {
    $("conn-dot").className = "dot off";
    $("conn-text").textContent = "Disconnected, retrying…";
  };
}
connect();
</script>
</body>
</html>
