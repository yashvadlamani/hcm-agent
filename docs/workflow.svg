<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="700" viewBox="0 0 1260 700" role="img" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <title>Current workflow</title>
  <desc>A care team member uploads a JSON call request to Azure Blob storage. An Azure Function validates it and asks Azure Communication Services to call the patient. Azure Communication Services speaks and listens on the call and sends call events to the Clara server on App Service, which gets replies from Azure OpenAI and streams the call to the live view. Key Vault holds secrets for the apps, and GitHub Actions tests and deploys the code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 600; fill: #2C2C2A; }
      .subtitle { font-size: 13px; fill: #5F5E5A; }
      .th { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; }
      .azure rect { fill: #E1F5EE; stroke: #0F6E56; }
      .azure .th { fill: #085041; } .azure .ts { fill: #0F6E56; }
      .tool rect { fill: #F1EFE8; stroke: #888780; }
      .tool .th { fill: #2C2C2A; } .tool .ts { fill: #5F5E5A; }
      .arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
      .code { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; font-size: 11.5px; fill: #2C2C2A; }
      .key { fill: #3C3489; } .str { fill: #085041; }
      .legend { font-size: 12px; fill: #5F5E5A; }
    </style>
  </defs>

  <rect x="0" y="0" width="1260" height="700" rx="16" fill="#FFFFFF"/>
  <text class="title" x="30" y="40">Current workflow</text>
  <text class="subtitle" x="30" y="62">Clara: from a JSON upload to a guarded patient call, all in Azure</text>

  <g transform="translate(0,60)">
    <!-- Sample request -->
    <rect x="30" y="86" width="400" height="309" rx="10" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1"/>
    <text class="th" x="50" y="112" fill="#2C2C2A">Sample request</text>
    <text class="ts" x="50" y="131" fill="#5F5E5A">Upload to call-requests / incoming / john-doe.json</text>
    <line x1="50" y1="144" x2="410" y2="144" stroke="#D3D1C7" stroke-width="1"/>
    <text class="code" xml:space="preserve" x="50" y="166">{</text>
    <text class="code" xml:space="preserve" x="50" y="185">  <tspan class="key">"to"</tspan>: <tspan class="str">"1-XXX-XXX-XXXX"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="204">  <tspan class="key">"name"</tspan>: <tspan class="str">"John Doe"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="223">  <tspan class="key">"for"</tspan>: <tspan class="str">"diabetes management"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="242">  <tspan class="key">"risk_drivers"</tspan>: [</text>
    <text class="code" xml:space="preserve" x="50" y="261">    <tspan class="str">"HbA1c above 7.5% at last check"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="280">    <tspan class="str">"Missed metformin refills in the last 60 days"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="299">    <tspan class="str">"No endocrinologist visit in over 12 months"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="318">    <tspan class="str">"ER visit for low blood sugar in last 90 days"</tspan>,</text>
    <text class="code" xml:space="preserve" x="50" y="337">    <tspan class="str">"Overdue annual diabetic eye exam"</tspan></text>
    <text class="code" xml:space="preserve" x="50" y="356">  ]</text>
    <text class="code" xml:space="preserve" x="50" y="375">}</text>

    <!-- Azure boundary -->
    <rect x="650" y="30" width="436" height="536" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
    <text class="th" x="868" y="58" text-anchor="middle" fill="#2C2C2A">Microsoft Azure</text>
    <text class="ts" x="868" y="76" text-anchor="middle" fill="#5F5E5A">Resource group clara-rg</text>

    <g class="azure">
      <rect x="668" y="90" width="192" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="764" y="113" text-anchor="middle">Blob storage</text>
      <text class="ts" x="764" y="132" text-anchor="middle">call-requests / incoming</text>
    </g>
    <g class="azure">
      <rect x="668" y="190" width="192" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="764" y="213" text-anchor="middle">Azure Function</text>
      <text class="ts" x="764" y="232" text-anchor="middle">Validates, places call</text>
    </g>
    <g class="azure">
      <rect x="668" y="290" width="192" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="764" y="313" text-anchor="middle">Clara server</text>
      <text class="ts" x="764" y="332" text-anchor="middle">App Service + guardrails</text>
    </g>
    <g class="azure">
      <rect x="668" y="390" width="192" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="764" y="413" text-anchor="middle">Azure OpenAI</text>
      <text class="ts" x="764" y="432" text-anchor="middle">gpt-5-mini replies</text>
    </g>
    <g class="azure">
      <rect x="668" y="490" width="192" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="764" y="513" text-anchor="middle">Key Vault</text>
      <text class="ts" x="764" y="532" text-anchor="middle">Secrets for the apps</text>
    </g>
    <g class="azure">
      <rect x="896" y="190" width="172" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="982" y="213" text-anchor="middle">Communication</text>
      <text class="ts" x="982" y="232" text-anchor="middle">Services: calls, speech</text>
    </g>

    <g class="tool">
      <rect x="470" y="90" width="150" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="545" y="113" text-anchor="middle">Care team</text>
      <text class="ts" x="545" y="132" text-anchor="middle">Uploads JSON</text>
    </g>
    <g class="tool">
      <rect x="470" y="290" width="150" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="545" y="313" text-anchor="middle">Live view</text>
      <text class="ts" x="545" y="332" text-anchor="middle">Watch calls (/live)</text>
    </g>
    <g class="tool">
      <rect x="470" y="440" width="150" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="545" y="463" text-anchor="middle">GitHub Actions</text>
      <text class="ts" x="545" y="482" text-anchor="middle">Tests, deploys</text>
    </g>
    <g class="tool">
      <rect x="1116" y="190" width="120" height="56" rx="8" stroke-width="1"/>
      <text class="th" x="1176" y="213" text-anchor="middle">Patient</text>
      <text class="ts" x="1176" y="232" text-anchor="middle">Takes the call</text>
    </g>

    <!-- Flow -->
    <line x1="430" y1="118" x2="466" y2="118" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <line x1="620" y1="118" x2="664" y2="118" class="arr" marker-end="url(#arrow)"/>
    <line x1="764" y1="146" x2="764" y2="186" class="arr" marker-end="url(#arrow)"/>
    <line x1="860" y1="218" x2="892" y2="218" class="arr" marker-end="url(#arrow)"/>
    <line x1="1070" y1="218" x2="1112" y2="218" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M982 250 L982 318 L864 318" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="764" y1="350" x2="764" y2="386" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="668" y1="318" x2="624" y2="318" class="arr" marker-end="url(#arrow)"/>
    <line x1="620" y1="468" x2="646" y2="468" class="arr" marker-end="url(#arrow)"/>

    <!-- Legend -->
    <rect x="30" y="594" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="legend" x="50" y="604">Azure service</text>
    <rect x="170" y="594" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/>
    <text class="legend" x="190" y="604">People and tools</text>
  </g>
</svg>
